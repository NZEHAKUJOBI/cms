version: '3.9'

# Production compose file for VPS deployment.
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Before first deploy, set these environment variables on the host:
#   PSCMS_DB_PASSWORD  – strong random password for Postgres
#   PSCMS_JWT_KEY      – random string, at least 32 characters
#
# The app will be reachable at  http://164.68.120.153:8181

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pscms
      POSTGRES_PASSWORD: ${PSCMS_DB_PASSWORD:?Set PSCMS_DB_PASSWORD env var}
      POSTGRES_DB: pscms
    # NOT exposed to the host – only reachable inside the Docker network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pscms']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./Server/PSCMS
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # These use ASP.NET Core's double-underscore convention to override appsettings.json values
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=pscms;Username=pscms;Password=${PSCMS_DB_PASSWORD}"
      Jwt__Key: "${PSCMS_JWT_KEY:?Set PSCMS_JWT_KEY env var (min 32 chars)}"
      AllowedOrigins: "http://164.68.120.153:8181"
    # NOT exposed to the host – the client Nginx proxies /api/ internally

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8181:80'  # Access the app at http://164.68.120.153:8181

volumes:
  pgdata:
